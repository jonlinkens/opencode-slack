# Slack app for @jonlinkens/opencode-slack-feedback and @jonlinkens/opencode-slack-agent.
# Create it at https://api.slack.com/apps → Create New App → From a manifest,
# or merge these settings into an existing app's manifest.
display_information:
  name: OpenCode
  description: Posts friction reports from OpenCode agents, and starts sessions when you mention it.
  background_color: "#0c0c0c"
features:
  bot_user:
    display_name: OpenCode
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:write
      - channels:read
      - groups:read
      - users:read
      - app_mentions:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
